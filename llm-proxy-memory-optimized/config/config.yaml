# config/config.yaml - Working configuration
server:
  host: "0.0.0.0"
  port: 8000

budget:
  daily_limit: 5.0
  hourly_limit: 1.0

models:
  default:
    primary:
      provider: groq
      model: llama-3.1-8b-instant
    fallbacks:
      - provider: openai
        model: gpt-3.5-turbo

providers:
  groq:
    enabled: true
    timeout: 30
  
  openai:
    enabled: true
    timeout: 30