<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Customer Support Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI Support Assistant</h1>
            <div class="status" id="status">Connected</div>
        </header>
        
        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="system-message">
                    👋 Welcome! I'm your AI support assistant. How can I help you today?
                </div>
            </div>
            
            <div class="typing-indicator" id="typingIndicator" style="display: none;">
                AI is thinking<span>.</span><span>.</span><span>.</span>
            </div>
            
            <div class="input-container">
                <textarea 
                    id="userInput" 
                    placeholder="Type your message here..."
                    rows="3"
                    maxlength="2000"
                ></textarea>
                <div class="input-footer">
                    <span class="character-count" id="charCount">0/2000</span>
                    <button id="sendButton" class="send-btn">Send Message</button>
                </div>
            </div>
        </div>
        
        <div class="metrics" id="metrics" style="display: none;">
            <div>Processing time: <span id="processingTime">0</span>ms</div>
            <div>Confidence: <span id="confidence">0</span>%</div>
            <div>Sentiment: <span id="sentiment">-</span></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
